name: Apply flexible subgroup builder

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_flexible_subgroups.py'
      - '.github/workflows/apply-flexible-subgroups.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply flexible subgroup changes
        run: python .github/scripts/apply_flexible_subgroups.py
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Allow unlimited passage subgroups'
            git push
          fi
