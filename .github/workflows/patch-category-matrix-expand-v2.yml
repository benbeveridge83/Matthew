name: Apply category matrix expansion patch v2

on:
  push:
    paths:
      - '.github/patch-category-matrix-expand-v2.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          css_path = Path('styles.css')
          index_path = Path('index.html')
          app = app_path.read_text()
          css = css_path.read_text()
          index = index_path.read_text()

          def sub1(pattern, replacement, text, label, flags=0):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Could not patch {label}')
              return out

          app = sub1(r"const APP_VERSION = '1\.3\.0';", "const APP_VERSION = '1.3.1';", app, 'version')

          app = sub1(
              r"function makePassageDetail\(group\) \{.*?\n\}\n\nfunction renderCategoryFilter",
              r'''function makePassageDetail(group) {
  const detail = document.createElement('div');
  detail.className = 'passage-detail';
  const sentences = document.createElement('div');
  sentences.className = 'passage-detail-sentences';
  (group.sentence_keys || []).slice().sort(compareSentenceIds).forEach((id) => {
    const sentence = sentenceById.get(id);
    if (!sentence) return;
    const p = document.createElement('p');
    const ref = document.createElement('span');
    ref.textContent = `${sentence.chapter}:${sentence.verse}`;
    p.append(ref, document.createTextNode(sentence.text));
    sentences.append(p);
  });
  detail.append(sentences);

  const actions = document.createElement('div');
  actions.className = 'passage-detail-actions';

  const categories = document.createElement('button');
  categories.type = 'button';
  categories.className = 'secondary-button compact-button';
  categories.dataset.detailCategories = group.id;
  categories.textContent = isSubgroup(group) ? 'Edit subgroup categories' : 'Edit categories';
  actions.append(categories);

  if (!isSubgroup(group)) {
    const children = subgroupsFor(group.id);
    const subgroupButton = document.createElement('button');
    subgroupButton.type = 'button';
    subgroupButton.className = 'secondary-button compact-button';
    subgroupButton.dataset.detailSubgroups = group.id;
    subgroupButton.textContent = children.length ? 'Manage subgroups' : 'Break into subgroups';
    if (!children.length && (group.sentence_keys || []).length < 2) {
      subgroupButton.disabled = true;
      subgroupButton.title = 'At least two sentences are required to make subgroups.';
    }
    actions.append(subgroupButton);
  }

  detail.append(actions);
  return detail;
}

function makePassageDetailRow(group) {
  const row = document.createElement('tr');
  row.className = 'passage-detail-row';
  const detailCell = document.createElement('td');
  detailCell.className = 'passage-detail-cell';
  detailCell.append(makePassageDetail(group));
  row.append(detailCell);
  state.columns.forEach(() => {
    const spacer = document.createElement('td');
    spacer.className = 'passage-detail-spacer';
    row.append(spacer);
  });
  return row;
}

function renderCategoryFilter''',
              app,
              'passage detail',
              re.S,
          )

          app = sub1(
              r"  const launch = document\.createElement\('span'\);\n  launch\.className = 'open-icon';\n  launch\.textContent = children\.length \? '▾' : '›';",
              r'''  const launch = document.createElement('button');
  launch.type = 'button';
  launch.className = 'open-icon';
  launch.dataset.expandGroup = group.id;
  const isExpanded = state.expanded.has(String(group.id));
  launch.textContent = isExpanded ? '▾' : '›';
  launch.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
  launch.setAttribute('aria-label', `${isExpanded ? 'Collapse' : 'Expand'} sentences for ${group.name}`);
  launch.title = isExpanded ? 'Hide sentences' : 'Show sentences';''',
              app,
              'arrow',
          )

          app = sub1(
              r"  visibleGroups\.forEach\(\(group\) => \{\n    els\.matrixBody\.append\(makeMatrixRow\(group\)\);\n    subgroupsFor\(group\.id\)\.forEach\(\(subgroup\) => els\.matrixBody\.append\(makeMatrixRow\(subgroup, \{ subgroup: true \}\)\)\);\n  \}\);",
              r'''  visibleGroups.forEach((group) => {
    els.matrixBody.append(makeMatrixRow(group));
    if (state.expanded.has(String(group.id))) els.matrixBody.append(makePassageDetailRow(group));
    subgroupsFor(group.id).forEach((subgroup) => {
      els.matrixBody.append(makeMatrixRow(subgroup, { subgroup: true }));
      if (state.expanded.has(String(subgroup.id))) els.matrixBody.append(makePassageDetailRow(subgroup));
    });
  });''',
              app,
              'row expansion rendering',
          )

          app = sub1(
              r"  els\.matrixBody\.addEventListener\('click', async \(event\) => \{\n    const edit = event\.target\.closest\('\[data-edit-group\]'\);",
              r'''  els.matrixBody.addEventListener('click', async (event) => {
    const expander = event.target.closest('[data-expand-group]');
    if (expander) {
      event.stopPropagation();
      const groupId = String(expander.dataset.expandGroup);
      if (state.expanded.has(groupId)) state.expanded.delete(groupId); else state.expanded.add(groupId);
      renderMatrix();
      return;
    }
    const detailCategories = event.target.closest('[data-detail-categories]');
    if (detailCategories) {
      event.stopPropagation();
      openCategoryDialog(detailCategories.dataset.detailCategories);
      return;
    }
    const detailSubgroups = event.target.closest('[data-detail-subgroups]');
    if (detailSubgroups) {
      event.stopPropagation();
      const group = state.groups.find((item) => String(item.id) === String(detailSubgroups.dataset.detailSubgroups));
      if (!group) return;
      if (isSplitGroup(group)) openSubgroupManager(group.id);
      else {
        openCategoryDialog(group.id);
        if (els.categoryDialog.open) showSubgroupPane(group);
      }
      return;
    }
    const edit = event.target.closest('[data-edit-group]');''',
              app,
              'matrix click handler',
          )

          marker = '/* v1.3.1 matrix passage expansion */'
          if marker not in css:
              css += '''\n\n/* v1.3.1 matrix passage expansion */\n.open-icon { padding: 0; background: var(--white); cursor: pointer; font-weight: 700; line-height: 1; }\n.open-icon:hover { border-color: var(--accent); background: #faf3e8; }\n.passage-detail-row td { background: #faf5ec; }\n.passage-detail-row td:first-child { background: #faf5ec; }\n.passage-detail-row .passage-detail-spacer { background: #faf5ec; }\n.passage-detail-cell { padding-top: 0 !important; }\n.passage-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }\n.passage-detail-actions .secondary-button { min-height: 34px; padding: 6px 10px; font-size: 11px; }\n.passage-detail-actions .secondary-button:disabled { cursor: not-allowed; opacity: .45; }\n@media (max-width: 720px) { .passage-detail { margin-left: 24px; padding: 11px 12px; } .passage-detail-actions { display: grid; grid-template-columns: 1fr; } .passage-detail-actions .secondary-button { width: 100%; } }\n'''

          index = index.replace('styles.css?v=1.3.0', 'styles.css?v=1.3.1')
          index = index.replace('app.js?v=1.3.0', 'app.js?v=1.3.1')
          index = index.replace('v1.3.0 · 28 chapters', 'v1.3.1 · 28 chapters')

          app_path.write_text(app)
          css_path.write_text(css)
          index_path.write_text(index)
          PY

          node --check app.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-category-matrix-expand.yml .github/workflows/patch-category-matrix-expand-v2.yml .github/patch-category-matrix-expand.trigger .github/patch-category-matrix-expand-v2.trigger
          git add app.js styles.css index.html
          git commit -m "Fix matrix row expansion and subgroup access"
          git push origin main
